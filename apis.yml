aid: cashflo
name: CashFlo
description: >-
  CashFlo is an India-based fintech platform that automates enterprise finance
  operations across accounts payable, payments, GST compliance, vendor
  management, and supply-chain financing. Its modules cover invoice OCR and
  n-way matching, approval workflows, multi-bank payments and reconciliation,
  GST filing / e-invoicing / e-way bills, vendor onboarding and KYC, and dynamic
  cash discounting for working-capital optimization. CashFlo connects to major
  ERPs (SAP ECC/S4 HANA/Business One, Oracle NetSuite/Fusion/EBS, Microsoft
  Dynamics 365/NAV/Business Central) and exposes a JWT-secured Data Ingestion
  API for pushing purchase orders and goods-receipt notes into the platform.
  Backed by General Catalyst.
